# Publica la app en GitHub Pages con cada push a main (o a mano desde
# Actions > Publicar en GitHub Pages > Run workflow).
# Requiere Settings > Pages > Source: "GitHub Actions" y, con cuenta gratuita, repo público.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto solo lectura; el permiso de publicar lo tiene únicamente el trabajo `deploy`,
# así el paso que instala dependencias y compila no puede escribir en Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
