# Publica la app en GitHub Pages.
# PAUSADO: el repositorio es privado y la cuenta gratuita no permite Pages en repos privados,
# así que por ahora solo se ejecuta a mano (Actions > Publicar en GitHub Pages > Run workflow).
# Para reactivar la publicación automática (con GitHub Pro o repo público), volver a agregar:
#   push:
#     branches: [main]
# y activar Pages en Settings > Pages > Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
